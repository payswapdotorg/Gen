version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false
  # ---- Gen Creative Intelligence OS (Phase 0, ARCHITECTURE_LOCK.md v1.0.0) ----
  # New modules are managed from day one. Ownership: ARCHITECTURE_LOCK.md §5.
  - id: media-capabilities
    roots: [packages/media-capabilities/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/media-capabilities/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: creative-capability
  - id: media-providers
    roots: [packages/media-providers/src]
    managed: true
    requires: [shared, media-capabilities]
    publicEntrypoints: [packages/media-providers/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: creative-provider
  - id: editor-adapters
    roots: [packages/editor-adapters/src]
    managed: true
    requires: [shared, media-capabilities, timeline]
    publicEntrypoints: [packages/editor-adapters/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: creative-editor
  - id: agent-lab
    roots: [packages/agent-lab/src]
    managed: true
    requires: [shared, media-capabilities]
    publicEntrypoints: [packages/agent-lab/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: creative-lab
  - id: arena-bridge
    roots: [packages/arena-bridge/src]
    managed: true
    requires: [shared, media-capabilities]
    publicEntrypoints: [packages/arena-bridge/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: creative-escalation
  - id: timeline
    roots: [packages/timeline/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/timeline/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: creative-artifact
  - id: creative-workspace
    roots: [apps/creative-workspace/src]
    managed: true
    requires: [shared, media-capabilities, timeline, agent-lab, arena-bridge]
    publicEntrypoints: [apps/creative-workspace/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters, ui: ui }
    layerOrder: [domain, app, ui, adapters]
    owner: creative-workspace

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
